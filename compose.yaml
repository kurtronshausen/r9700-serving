x-vllm-full-cache-volumes: &vllm_full_cache_volumes
  - ./chat-templates/:/app/chat-templates
  - ./fused_moe_configs/:/app/fused_moe_configs
  - ./tools/tune_fused_moe.py:/app/tune_fused_moe.py
  - ./fp8_configs/:/app/fp8_configs
  - ./tools/tune_fp8_dense.py:/app/tune_fp8_dense.py
  - ./fp8_configs/N=2048,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=2048,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=2048,K=256,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=2048,K=256,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=4608,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=4608,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=512,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=512,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=6144,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=6144,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=17408,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=17408,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=5120,K=3072,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=5120,K=3072,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=5120,K=8704,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=5120,K=8704,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=7168,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=7168,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=8192,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=8192,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  # Overlay of protocol.py: tolerate `tools: []` + `tool_choice: "none"` that
  # some clients send (upstream rejects empty tools arrays). Version-locked to
  # VLLM_REF=v0.28.0rc2; refresh from patches/vllm/protocol.py on upgrade.
  - ./patches/vllm/protocol.py:/opt/venv/lib/python3.12/site-packages/vllm/entrypoints/openai/chat_completion/protocol.py:ro
  # Mount the whole home so every tool's dot-dir (caches, kernel JIT dirs) is
  # user-owned on the host. Cache dirs are redirected under ~/.cache via env
  # (TRITON_CACHE_DIR, TORCHINDUCTOR_CACHE_DIR, AITER_JIT_DIR, TILELANG_CACHE_DIR)
  # so `just clear-vllm-caches` can manage them.
  - ${HOME}:${HOME}
  - ${HOME}/.vllm-workspace:/workspace
  # Local checkpoints (RTN/community W4A16 quants, etc.) live under /srv/llm,
  # outside HOME.
  - /srv/llm:/srv/llm

x-amd-devices: &amd_devices
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add:
    - "video"
    # render group gid — host-specific; set RENDER_GID in .env for this host
    # (this host: AMDGPU "render"). Numeric form required because the image
    # has no "render" group entry.
    - "${RENDER_GID:-992}"
  cap_add:
    - SYS_PTRACE
  security_opt:
    - label=disable
  ipc: host

services:
  vllm:
    <<: *amd_devices
    image: localhost/vllm-fullbuild:latest
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.fullbuild
      args:
        ROCM_IMAGE: ${ROCM_IMAGE}
        GPU_ARCH: ${GPU_ARCH}
        MAX_JOBS: ${MAX_JOBS}
        TORCH_VERSION: ${TORCH_VERSION}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION}
        VLLM_REF: ${VLLM_REF}
        VLLM_VERSION: ${VLLM_VERSION}
        AITER_REF: ${AITER_REF}
        FLASH_ATTN_REF: ${FLASH_ATTN_REF}
    container_name: vllm
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    networks:
      default:
        aliases:
          - llm-backend
    volumes: *vllm_full_cache_volumes
    env_file:
      - env/2xr9700.vllm.common
      - env/aiter-unified-attention.env
      - env/qwen3.6.env.common
      - ./env/${MODEL_PROFILE}.env
    environment:
      - HOME=${HOME}
      # Point aiter's JIT build at the user-owned cache dir and put it on
      # sys.path. Without this, non-root runs fall back to ~/.aiter/jit (not on
      # sys.path) and `import aiter.jit.module_aiter_core` fails with
      # ModuleNotFoundError, breaking the unified-attention backend.
      - AITER_JIT_DIR=${HOME}/.cache/aiter/jit
      - TRITON_CACHE_DIR=${HOME}/.cache/triton
      - TORCHINDUCTOR_CACHE_DIR=${HOME}/.cache/torchinductor
      - TILELANG_CACHE_DIR=${HOME}/.cache/tilelang
      - GPU_MAX_HW_QUEUES=1
      - NCCL_P2P_DISABLE=1
      - VLLM_TUNED_CONFIG_FOLDER=/app/fused_moe_configs
      # froggeric Qwen chat template for the qwen3.x profiles. entrypoint.sh
      # omits --chat-template when this is unset, so profiles served by
      # vllm-vision fall back to the tokenizer's built-in template.
      - VLLM_CHAT_TEMPLATE=/app/chat-templates/qwen.jinja
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
  # Second, concurrent vLLM server for Qwen3.8-Flash-Next (qwen4_exp). Same
  # entrypoint as `vllm`, but built from Dockerfile.flashnext — byte-identical
  # stages except the vLLM build, which applies patches/vllm-flashnext/
  # (newer vLLM head carrying qwen4_exp support + the local PLE CPU-offload
  # patch) at FLASHNEXT_VLLM_REF/FLASHNEXT_VLLM_VERSION. The pins are
  # separate from the main service's VLLM_REF, so the two images build and
  # cache independently: switching back to the qwen3.8-27b stack never
  # touches the flashnext image (and vice versa).
  #
  # The PLE n-gram table (~51 GiB) stays in pinned HOST memory
  # (VLLM_PLE_CPU_OFFLOAD=1 in the profile env) — the host needs ~110 GiB of
  # free RAM.
  #
  # Per-container compile cache dirs (so two containers JIT-ing at once never
  # share mutable cache state). The aiter JIT dir is deliberately SHARED:
  # `just prewarm` builds it once in the main service's env, and concurrent
  # readers of already-built kernels are safe — only concurrent builds race.
  # Both containers see all GPUs (env/2xr9700.vllm.common); assign them
  # non-overlapping GPU sets at runtime when running both at once.
  #
  # Its volumes list duplicates the x-vllm-full-cache-volumes anchor with a
  # different protocol.py overlay: the two images carry different vLLM trees,
  # so the overlays are version-locked separately
  # (patches/vllm-flashnext/protocol.py vs patches/vllm/protocol.py).
  vllm-qwen-flashnext:
    <<: *amd_devices
    image: localhost/vllm-flashnext:latest
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.flashnext
      args:
        ROCM_IMAGE: ${ROCM_IMAGE}
        GPU_ARCH: ${GPU_ARCH}
        MAX_JOBS: ${MAX_JOBS}
        TORCH_VERSION: ${TORCH_VERSION}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION}
        VLLM_REF: ${FLASHNEXT_VLLM_REF}
        VLLM_VERSION: ${FLASHNEXT_VLLM_VERSION}
        AITER_REF: ${AITER_REF}
        FLASH_ATTN_REF: ${FLASH_ATTN_REF}
    container_name: flashnext-vllm
    restart: unless-stopped
    ports:
      - "${FLASHNEXT_PORT:-8001}:8000"
    networks:
      default:
        aliases:
          - llm-flashnext-backend
    # FLASHNEXT_PROFILE selects the flashnext model profile (default: the
    # full W4A16 model; qwen3.8-flash-next-tiny = 119 MB Qwen4Exp smoke
    # model that coexists with the running 27b service). Override at
    # runtime: FLASHNEXT_PROFILE=qwen3.8-flash-next-tiny just up-flashnext
    volumes:
      - ./chat-templates/:/app/chat-templates
      - ./fused_moe_configs/:/app/fused_moe_configs
      - ./tools/tune_fused_moe.py:/app/tune_fused_moe.py
      - ./tools/tune_fused_moe_int4.py:/app/tune_fused_moe_int4.py
      - ./fp8_configs/:/app/fp8_configs
      - ./tools/tune_fp8_dense.py:/app/tune_fp8_dense.py
      # Overlay of protocol.py: tolerate `tools: []` + `tool_choice: "none"`
      # that some clients send (upstream rejects empty tools arrays).
      # Version-locked to FLASHNEXT_VLLM_REF=2a4cd640; refresh from
      # patches/vllm-flashnext/protocol.py on upgrade.
      - ./patches/vllm-flashnext/protocol.py:/opt/venv/lib/python3.12/site-packages/vllm/entrypoints/openai/chat_completion/protocol.py:ro
      - ${HOME}:${HOME}
      - ${HOME}/.vllm-workspace:/workspace
      # Local checkpoints (RTN W4A16 etc.) live under /srv/llm, outside HOME.
      - /srv/llm:/srv/llm
    env_file:
      - env/2xr9700.vllm.common
      - env/aiter-unified-attention.env
      - env/qwen3.6.env.common
      - ./env/${FLASHNEXT_PROFILE:-qwen3.8-flash-next}.env
    environment:
      - HOME=${HOME}
      # Shared with the `vllm` service: prewarmed once, read-only afterwards.
      - AITER_JIT_DIR=${HOME}/.cache/aiter/jit
      - TRITON_CACHE_DIR=${HOME}/.cache/triton_flashnext
      - TORCHINDUCTOR_CACHE_DIR=${HOME}/.cache/torchinductor_flashnext
      - TILELANG_CACHE_DIR=${HOME}/.cache/tilelang_flashnext
      - GPU_MAX_HW_QUEUES=1
      - NCCL_P2P_DISABLE=1
      - VLLM_TUNED_CONFIG_FOLDER=/app/fused_moe_configs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 900s

  # Third, standalone vLLM server: the prebuilt `stilldeadcode/vllm-radiance`
  # image (Docker Hub, NOT built by this repo) serving Qwen3.8-27B-FP8. This
  # image bundles its own from-source ROCm/PyTorch/AITER/vLLM stack plus
  # hand-written gfx1201 kernels (R4D: paged attention, gated-delta-net
  # prefill scan, P2P all-reduce, skinny bf16 GEMM) purpose-built for exactly
  # this model's geometry (head_dim 256, 6 query heads per KV head). Not a
  # fit for Flash-Next (wrong vLLM version/quant/shape for it) — see
  # plan.md's 2026-08-30 feasibility notes.
  #
  # Not intended to run concurrently with `vllm`/`vllm-qwen-flashnext` (per
  # user confirmation) — no non-overlapping GPU partitioning is applied here.
  # RADIANCE_TP defaults to 4 (all 4 GPUs) — validated 2026-08-30: 4/4 ranks
  # healthy, P2P enabled on all 6 pairs, R4D_AR engaged with no fallback,
  # coherent (single/4-concurrent/vision), and strictly faster than TP=2
  # across the board (pp2048 ~4388 vs ~3986-4000, tg32 104.46±14.99 vs
  # 81.49±7.20, tg128 99.07±3.07 vs 89.64±14.84 — see
  # benchmarks/2026-08-30_qwen3.8-27b_radiance_tp2_bench.md for the TP=2
  # baseline this beat). Upstream's own docs only claim TP=2 as tested, so
  # revert to `RADIANCE_TP=2`/`RADIANCE_HIP_VISIBLE_DEVICES=0,1` in `.env` if
  # a future image bump regresses this.
  #
  # Unlike `vllm`/`vllm-qwen-flashnext`, this image's ENTRYPOINT is its own
  # `radiance_entrypoint.sh` (banner + prechecks, then `exec vllm serve
  # "$@"`) — args come from `command:` below, not our entrypoint.sh's
  # env-var-assembly convention, so this service intentionally does NOT use
  # an `env/${MODEL_PROFILE}.env`-style profile file.
  vllm-radiance:
    <<: *amd_devices
    image: docker.io/stilldeadcode/vllm-radiance:${RADIANCE_VLLM_RADIANCE_TAG:-0.9.3}
    container_name: vllm-radiance
    restart: unless-stopped
    ports:
      - "${RADIANCE_PORT:-8002}:8000"
    networks:
      default:
        aliases:
          - llm-radiance-backend
    command:
      # HF-hub-cache-style layout (blobs/refs/snapshots), not a flat dir —
      # this is the snapshot `refs/main` currently points to. Re-check
      # `cat /srv/llm/Qwen/Qwen3.8-27B-FP8/refs/main` after any re-sync/
      # re-download of this model and update the hash below if it changed.
      - /srv/llm/Qwen/Qwen3.8-27B-FP8/snapshots/017b9c7af6b5689d5dd426a76e0bc077eb5ca20a
      - --served-model-name=qwen3.8-27b-radiance
      - --quantization=fp8
      - --tensor-parallel-size=${RADIANCE_TP:-4}
      - --max-num-seqs=${RADIANCE_MAX_NUM_SEQS:-256}
      - --max-model-len=${RADIANCE_MAX_MODEL_LEN:-262144}
      - --gpu-memory-utilization=${RADIANCE_GPU_UTIL:-0.90}
      - --max-num-batched-tokens=${RADIANCE_MAX_NUM_BATCHED_TOKENS:-4096}
      # bf16 KV (not radiance's own fp8-KV reference default): matches this
      # repo's main qwen3.8-27b profile, since the stock FP8 checkpoint ships
      # no calibrated KV scales (fp8 KV would serve at an uncalibrated
      # scale of 1.0). bf16 roughly doubles KV bytes/token vs fp8 — re-derive
      # RADIANCE_MAX_NUM_BATCHED_TOKENS/KV headroom after first boot rather
      # than assuming radiance's fp8-tuned defaults carry over.
      - --kv-cache-dtype=bfloat16
      # R4D: radiance's hand-written gfx1201 kernels (the headline feature).
      # Requires head_dim 256 / 6 query-heads-per-KV-head / paged block 16 /
      # causal decoder attention / bf16-or-fp8 KV — all satisfied here.
      - --attention-backend=R4D
      # Hybrid GDN model: both flags are required or vLLM silently disables
      # prefix caching (hybrid models default their APC support flag off).
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      # MTP self-speculation (head is in the checkpoint, no separate
      # drafter). Give the drafter the same R4D backend as the target.
      - '--speculative-config={"method":"mtp","num_speculative_tokens":${RADIANCE_MTP_NSPEC:-8},"attention_backend":"R4D","disable_padded_drafter_batch":true}'
      # Required with disable_padded_drafter_batch (vLLM would otherwise
      # auto-enable async scheduling then disable it with a runtime warning).
      - --no-async-scheduling
      # 2026-08-30: reasoning-loop investigation. Same loop symptom
      # reproduced on flashnext (unrelated vLLM build) and even in a fresh
      # client session — ruling out a version-specific bug or session
      # poisoning, pointing at a decoding-time cause. This service ran with
      # NO --override-generation-config at all (deferring entirely to
      # whatever the client requests); a community 4xR9700 Flash-Next build
      # (tcclaviger/vllm:DevQwenNextFlash) runs presence_penalty=1 with no
      # reported loop. Testing the same value here.
      - '--override-generation-config={"presence_penalty":1.0}'
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=qwen3
      # Reuse this repo's own vetted froggeric template (not radiance's
      # qwen3.8-enhanced.jinja) — see plan.md open items; can A/B later.
      - --chat-template=/app/chat-templates/qwen.jinja
      # Vision ON (not --language-model-only): matches the main vllm
      # service's convention for this same VL checkpoint. image cap of 1
      # (not the vLLM default) — 2+ large images in one hybrid-Mamba prompt
      # deadlocks the engine (vllm-project/vllm#40707, unfixed, #40709 not
      # merged). Raise only if that lands upstream.
      - '--limit-mm-per-prompt={"image":1,"audio":0,"video":0}'
      - --trust-remote-code
      - --host=0.0.0.0
      - --port=8000
    environment:
      - HOME=${HOME}
      # GPU visibility: HIP index only, never CUDA_VISIBLE_DEVICES. Widen to
      # 0,1,2,3 for the TP=4 stretch goal (plan.md Phase 2).
      - HIP_VISIBLE_DEVICES=${RADIANCE_HIP_VISIBLE_DEVICES:-0,1,2,3}
      - ROCR_VISIBLE_DEVICES=${RADIANCE_HIP_VISIBLE_DEVICES:-0,1,2,3}
      # AITER: unified attention ON, every other AITER path OFF (per
      # upstream's own reference compose: "LINEAR=1 crashes on gfx1201").
      - VLLM_ROCM_USE_AITER=1
      - VLLM_ROCM_USE_AITER_UNIFIED_ATTENTION=1
      - VLLM_ROCM_USE_AITER_MHA=0
      - VLLM_ROCM_USE_AITER_MLA=0
      - VLLM_ROCM_USE_AITER_MOE=0
      - VLLM_ROCM_USE_AITER_LINEAR=0
      - VLLM_ROCM_USE_AITER_FP8BMM=0
      - VLLM_ROCM_USE_AITER_FP4BMM=0
      - VLLM_ROCM_USE_AITER_RMSNORM=0
      # Master switch + individual R4D kernel toggles (all baked ON in the
      # image; explicit here for visibility/overridability). R4D_AR (the P2P
      # all-reduce) is documented as built/tested for TP=2 specifically —
      # watch the startup banner's kernel-resolution lines when moving to
      # TP=4, it may silently fall back to RCCL.
      - RADIANCE_USE_R4D=${RADIANCE_USE_R4D:-1}
      - RADIANCE_USE_R4D_AR=${RADIANCE_USE_R4D_AR:-1}
      - RADIANCE_USE_R4D_AR_QUANT=1
      - RADIANCE_FUSE_RMS_QUANT=1
      - RADIANCE_DYNAMIC_DRAFT=1
      - RADIANCE_DRAFT_SCHEDULE=${RADIANCE_DRAFT_SCHEDULE:-1:8,2:7,4:6,8:5,16:4}
      - RADIANCE_DRAFT_TAU=${RADIANCE_DRAFT_TAU:-0.28}
      - RADIANCE_FAST_DRAFT=${RADIANCE_FAST_DRAFT:-1}
      - NCCL_PROTO=Simple
      - TORCHINDUCTOR_COMPILE_THREADS=4
      # Per-container compile caches (own suffix, mirrors the `_flashnext`
      # convention) so this image's from-scratch JIT/inductor cache never
      # shares mutable state with the other two services.
      - VLLM_CACHE_ROOT=${HOME}/.cache/vllm_radiance
      - TORCHINDUCTOR_CACHE_DIR=${HOME}/.cache/torchinductor_radiance
      - TRITON_CACHE_DIR=${HOME}/.cache/triton_radiance
      - AITER_ROOT_DIR=${HOME}/.cache/aiter_radiance
      - TRITON_CACHE_AUTOTUNING=1
    volumes:
      - ./chat-templates/:/app/chat-templates
      - ${HOME}:${HOME}
      - ${HOME}/.vllm-workspace:/workspace
      # Local checkpoints (the model dir referenced in `command:` above).
      - /srv/llm:/srv/llm
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 60
      # Generous: brand-new image, from-scratch JIT/inductor cache on first
      # boot (upstream: "a few extra minutes compiling Triton / inductor
      # kernels before the engine comes up").
      start_period: 1800s

  # Fourth, standalone vLLM server: the prebuilt `tcclaviger/vllm` image
  # (Docker Hub, NOT built by this repo) serving
  # tcclaviger/Qwen3.8-Flash-Next-MXFP4-FP8 — the same Qwen3.8-Flash-Next
  # (qwen4_exp) family as `vllm-qwen-flashnext`, but tcclaviger's own
  # MXFP4-experts / FP8-attention-and-MTP / FP8-n-gram quant with calibrated
  # fp8 KV scales and his GDN/PLE kernel work (CLAV_GDN=1).
  #
  # Image: PINNED BY DIGEST. The model card states "Only the :dev image tag at
  # tcclaviger/vllm can serve this model", but `dev` is a *mutable* tag: it
  # pointed at the 2026-09-07 build this service has always run and now points
  # at a 2026-09-21 rebuild. Pinning the digest keeps a hub push from silently
  # breaking the working service. To bump deliberately, resolve the new `dev`
  # digest and replace MXFP4_VLLM_REF.
  #
  # Like `vllm-radiance`, this is a prebuilt community image: its ENTRYPOINT
  # is tcclaviger's own (banner + `exec vllm serve "$@"`), so args come from
  # `command:` below (mirroring his model-card example) and it uses no
  # `env/${profile}.env` file. It is NOT built/patched by this repo and
  # can't pick up local fixes.
  #
  # Same one-at-a-time constraint as the other three: TP=4 wants all four
  # GPUs, and VLLM_PLE_CPU_OFFLOAD pins ~110 GiB of host RAM for the 51B
  # n-gram PLE table.
  vllm-mxfp4:
    <<: *amd_devices
    image: docker.io/tcclaviger/vllm@${MXFP4_VLLM_REF:-sha256:4fd57a9c7e313183ea973227fddcd30e4d6712581c0fa2954607a807d34693dc}
    container_name: vllm-mxfp4
    restart: unless-stopped
    ports:
      - "${MXFP4_PORT:-8003}:8080"
    networks:
      default:
        aliases:
          - llm-mxfp4-backend
    command:
      # Local path (repo convention: big models live under /srv/llm on the
      # 1.3T /srv/llm volume, NOT in ~/.cache on the 98G /home volume).
      # Downloaded once via:
      #   hf download tcclaviger/Qwen3.8-Flash-Next-MXFP4-FP8 \
      #     --local-dir /srv/llm/tcclaviger/Qwen3.8-Flash-Next-MXFP4-FP8
      # Do NOT use the bare HF id here — vLLM would resolve it through the
      # HF hub and download into ~/.cache/huggingface (this image runs as
      # root, writing root-owned blobs) and fill /home.
      - /srv/llm/tcclaviger/Qwen3.8-Flash-Next-MXFP4-FP8
      - --tensor-parallel-size=${MXFP4_TP:-4}
      - --served-model-name=Qwen3.8-Flash-Next-MXFP4-FP8
      # His validated flags (HF model card, 2026-09). Quantization is baked
      # into the checkpoint (compressed-tensors MXFP4/FP8) — no --quantization.
      # fp8 KV: the checkpoint ships calibrated KV scales
      # (model-kvscales.safetensors), so fp8 KV is correctly scaled here
      # (unlike the stock 27B-FP8 checkpoint, which is why we default bf16
      # elsewhere).
      - --kv-cache-dtype=fp8
      - --max-model-len=${MXFP4_MAX_MODEL_LEN:-262144}
      - --gpu-memory-utilization=${MXFP4_GPU_UTIL:-0.92}
      - --max-num-seqs=${MXFP4_MAX_NUM_SEQS:-16}
      - --max-num-batched-tokens=${MXFP4_MAX_NUM_BATCHED_TOKENS:-4096}
      - --enable-prefix-caching
      - --enable-chunked-prefill
      # MTP self-speculation (head is in the checkpoint, no drafter).
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
      # CUDA graphs without torch.compile: decode-only capture (his example's
      # sizes list; mode stays eager).
      - '--compilation-config={"cudagraph_capture_sizes":[4,8,12,16,20,24,28,32],"max_cudagraph_capture_size":32}'
      # YaRN rope extension: the model's native context is 262144 and the
      # card's 524288 example relies on this to extrapolate. NOTE: vLLM
      # derives its max_model_len cap from max_position_embeddings, not from
      # this factor, so raising MXFP4_MAX_MODEL_LEN past 262144 also needs
      # VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 (see vllm-gptq below). Left in place
      # because the pinned image accepts it; harmless at 262144.
      - '--hf-overrides={"text_config":{"rope_parameters":{"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":262144,"mrope_section":[11,11,10],"mrope_interleaved":true,"partial_rotary_factor":0.25,"rope_theta":10000000}}}'
      - --tool-call-parser=qwen3_coder
      - --enable-auto-tool-choice
      - --reasoning-parser=qwen3
      # Froggeric template (same one radiance uses for this model family)
      # instead of the checkpoint's built-in template, which raises on
      # reasoning_effort=high. Maps high→low here; see qwen.jinja.
      - --chat-template=/app/chat-templates/qwen.jinja
      - '--limit-mm-per-prompt={"video":1,"image":20}'
      - --mm-processor-cache-gb=0.5
      - '--override-generation-config={"max_tokens":65536,"temperature":1.0,"top_p":0.95,"top_k":40,"presence_penalty":1}'
      - --host=0.0.0.0
      - --port=8080
    environment:
      - HOME=${HOME}
      # GPU visibility: HIP index only, never CUDA_VISIBLE_DEVICES.
      - HIP_VISIBLE_DEVICES=${MXFP4_HIP_VISIBLE_DEVICES:-0,1,2,3}
      - ROCR_VISIBLE_DEVICES=${MXFP4_HIP_VISIBLE_DEVICES:-0,1,2,3}
      # tcclaviger's image serves qwen4_exp with its own kernel paths
      # (CLAV_GDN): AITER is OFF (his example sets VLLM_ROCM_USE_AITER=0) —
      # do not import our aiter-unified-attention env here.
      - VLLM_ROCM_USE_AITER=0
      - CLAV_GDN=1
      # 51B n-gram PLE table pinned in host RAM (~110 GiB free needed).
      - VLLM_PLE_CPU_OFFLOAD=1
      # Per-container compile caches (own suffix, mirrors the `_flashnext`
      # / `_radiance` convention) so this image's JIT/inductor cache never
      # shares mutable state with the other services.
      - VLLM_CACHE_ROOT=${HOME}/.cache/vllm_mxfp4
      - TORCHINDUCTOR_CACHE_DIR=${HOME}/.cache/torchinductor_mxfp4
      - TRITON_CACHE_DIR=${HOME}/.cache/triton_mxfp4
      - AITER_ROOT_DIR=${HOME}/.cache/aiter_mxfp4
    volumes:
      - ./chat-templates/:/app/chat-templates
      - ${HOME}:${HOME}
      - ${HOME}/.vllm-workspace:/workspace
      # Local checkpoints (the 125.8 GB MXFP4-FP8 model referenced in
      # `command:` above) live under /srv/llm, outside HOME.
      - /srv/llm:/srv/llm
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 60
      # Generous: first boot loads the 125.8 GB checkpoint from /srv/llm
      # AND compiles Triton/inductor kernels from scratch.
      start_period: 1800s

  # Fifth, standalone vLLM server: the GPTQ ("AA2") build of the same
  # Qwen3.8-Flash-Next model family, kept as a SEPARATE service from
  # `vllm-mxfp4` so a checkpoint switch is a `just` invocation rather than a
  # compose edit + cache clear. The GPTQ quant stores the n-gram PLE table as
  # int6 (41.6 GB vs 51.3 GB FP8) and uses activation-aware MXFP4 experts,
  # for better PPL/top-1 than the MXFP4-FP8 checkpoint `vllm-mxfp4` serves.
  #
  # Image: resolved by TAG with `pull_policy: always`, because this checkpoint
  # needs a newer image than the pinned one above and we want the newest build
  # on every start. Use the version tag, NOT `latest`: on 2026-09-21 `latest`
  # still resolves to a 2026-09-14 build while `29.02.1` (== today's `dev`) is
  # 7 days newer. Set GPTQ_VLLM_REF to a digest to freeze this service too.
  #
  # The serve config below comes from the GPTQ model card's TP4 example, not
  # from `--recipes`: as of 29.02.1 every bundled recipe is TP2 on the
  # MXFP4-FP8 checkpoint, so there is no confirmed TP4 or GPTQ configuration
  # to copy. Treat this service as experimental.
  #
  # Driver-tuning env from the card example (GPU_MAX_HW_QUEUES=1,
  # HSA_ENABLE_INTERRUPT=1, HSA_ENABLE_MWAITX=1) is deliberately NOT set here:
  # it was present for the only `amdgpu` MES unrecoverable + failed-GPU-reset
  # that hard-hung the host, and none of the image's own confirmed recipes set
  # any of it. Add them via the env block below if you want to A/B them.
  vllm-gptq:
    <<: *amd_devices
    pull_policy: always
    image: docker.io/tcclaviger/vllm:${GPTQ_VLLM_TAG:-29.02.1}
    container_name: vllm-gptq
    restart: unless-stopped
    ports:
      - "${GPTQ_PORT:-8004}:8080"
    networks:
      default:
        aliases:
          - llm-gptq-backend
    ulimits:
      # His recipes all raise memlock: VLLM_PLE_CPU_OFFLOAD pins tens of GB
      # of PLE tables in host RAM and wants them non-swappable.
      memlock:
        soft: -1
        hard: -1
    command:
      # Local path (repo convention: big models live under /srv/llm on the
      # 1.3T /srv/llm volume, NOT in ~/.cache on the 98G /home volume).
      # Downloaded once via:
      #   hf download tcclaviger/Qwen3.8-Flash-Next-MXFP4-FP8-GPTQ \
      #     --local-dir /srv/llm/tcclaviger/Qwen3.8-Flash-Next-MXFP4-FP8-GPTQ
      # Do NOT use the bare HF id here — vLLM would resolve it through the
      # HF hub and download into ~/.cache/huggingface (this image runs as
      # root, writing root-owned blobs) and fill /home.
      - ${GPTQ_MODEL_DIR:-/srv/llm/tcclaviger/Qwen3.8-Flash-Next-MXFP4-FP8-GPTQ}
      - --tensor-parallel-size=${GPTQ_TP:-4}
      - --served-model-name=${GPTQ_SERVED_NAME:-Qwen3.8-Flash-Next-MXFP4-FP8}
      # Quantization is baked into the checkpoint (compressed-tensors
      # MXFP4-pack + int6 PLE) — no --quantization flag. fp8 KV: the
      # checkpoint ships calibrated KV scales, as with vllm-mxfp4.
      - --kv-cache-dtype=fp8
      # 262144 is the model's native context (max_position_embeddings) and
      # what every recipe bundled in the image runs. The card's TP4 example
      # passes 524288 relying on the YaRN --hf-overrides below, but newer
      # images derive the cap from max_position_embeddings and REJECT it
      # unless VLLM_ALLOW_LONG_MAX_MODEL_LEN=1 is set (that env is a
      # deliberate opt-in to positions past the trained window -- not set
      # here). Bump GPTQ_MAX_MODEL_LEN to 524288 only together with that env;
      # note it also doubles the worst-case KV reservation per request.
      - --max-model-len=${GPTQ_MAX_MODEL_LEN:-262144}
      # 0.92, matching vllm-mxfp4 — NOT the card example's 0.97. vLLM sizes the
      # KV pool as (util*VRAM - weights), subtracting ONLY weights, so 0.97
      # reserved 6.39 GiB of KV and left no room for the 1.06 GiB activation +
      # 0.66 GiB CUDA-graph footprint it measured: weights+KV+act+graphs came
      # to ~32.6 GiB against ~31.2 GiB physically free, so a large-context
      # prefill (seen at ~157k tokens) hit "0 bytes free" OOM. 0.92 brings the
      # reservation to ~4.8 GiB — vLLM's own "fully utilize" figure — so the
      # total fits with activation headroom. The pool is sized AFTER CUDA-graph
      # capture; this trades a little on-paper KV for not OOMing under load.
      - --gpu-memory-utilization=${GPTQ_GPU_UTIL:-0.92}
      - --max-num-seqs=${GPTQ_MAX_NUM_SEQS:-16}
      - --max-num-batched-tokens=${GPTQ_MAX_NUM_BATCHED_TOKENS:-8192}
      - --enable-prefix-caching
      - --enable-chunked-prefill
      # MTP self-speculation (head is in the checkpoint, no drafter).
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
      # Decode-only CUDA graph capture over the concurrency ladder (same list
      # his TP2 recipes use, rather than the single-size capture in the card's
      # TP4 example).
      - '--compilation-config={"cudagraph_capture_sizes":${GPTQ_CUDAGRAPH_SIZES:-[4,8,12,16,20,24,28,32]},"max_cudagraph_capture_size":${GPTQ_MAX_CUDAGRAPH_SIZE:-32}}'
      - '--hf-overrides={"text_config":{"rope_parameters":{"rope_type":"yarn","factor":2.0,"original_max_position_embeddings":262144,"mrope_section":[11,11,10],"mrope_interleaved":true,"partial_rotary_factor":0.25,"rope_theta":10000000}}}'
      - --tool-call-parser=qwen3_coder
      - --enable-auto-tool-choice
      - --reasoning-parser=qwen3
      # Froggeric template (same as vllm-mxfp4): the GPTQ checkpoint's own
      # template has the same reasoning_effort bug, so keep the override.
      - --chat-template=/app/chat-templates/qwen.jinja
      - '--limit-mm-per-prompt={"video":1,"image":20}'
      - --mm-processor-cache-gb=0.5
      # Card sampling defaults (note: temperature 0.8, vs 1.0 for vllm-mxfp4).
      - '--override-generation-config={"max_tokens":${GPTQ_MAX_TOKENS:-65536},"temperature":${GPTQ_TEMPERATURE:-0.8},"top_p":${GPTQ_TOP_P:-0.95},"top_k":${GPTQ_TOP_K:-40},"presence_penalty":${GPTQ_PRESENCE_PENALTY:-1}}'
      - --host=0.0.0.0
      - --port=8080
    environment:
      - HOME=${HOME}
      # GPU visibility: HIP index only, never CUDA_VISIBLE_DEVICES.
      - HIP_VISIBLE_DEVICES=${GPTQ_HIP_VISIBLE_DEVICES:-0,1,2,3}
      - ROCR_VISIBLE_DEVICES=${GPTQ_HIP_VISIBLE_DEVICES:-0,1,2,3}
      - VLLM_ROCM_USE_AITER=0
      - CLAV_GDN=1
      # int6 n-gram PLE table pinned in host RAM (~116 GB total footprint).
      - VLLM_PLE_CPU_OFFLOAD=1
      - OMP_NUM_THREADS=${GPTQ_OMP_NUM_THREADS:-8}
      # Reduce torch allocator fragmentation. The OOM that dropped util to 0.92
      # showed 760 MiB reserved-but-unallocated — variable-size activations
      # across long-context prefills fragment the pool; expandable segments let
      # torch grow/shrink VAs instead of stranding holes. Complements the util
      # fix; neither alone is sufficient.
      - PYTORCH_CUDA_ALLOC_CONF=${GPTQ_PYTORCH_ALLOC_CONF:-expandable_segments:True}
      # Own cache suffix — NOT shared with vllm-mxfp4. These caches key on
      # the checkpoint, so two checkpoints in one dir corrupt each other's
      # compiled kernels. They are root-owned (this image runs as root), so
      # clearing them needs sudo rather than `just clear-vllm-caches`.
      - VLLM_CACHE_ROOT=${HOME}/.cache/vllm_gptq
      - TORCHINDUCTOR_CACHE_DIR=${HOME}/.cache/torchinductor_gptq
      - TRITON_CACHE_DIR=${HOME}/.cache/triton_gptq
      - AITER_ROOT_DIR=${HOME}/.cache/aiter_gptq
      # Card driver-tuning env, off by default — see the service comment.
      # Uncomment ONE at a time to A/B it. (An empty-value assignment such as
      # GPU_MAX_HW_QUEUES= is not the same as leaving it unset, so there is no
      # `.env`-driven default form here.)
      # - GPU_MAX_HW_QUEUES=1
      # - HSA_ENABLE_INTERRUPT=1
      # - HSA_ENABLE_MWAITX=1
    volumes:
      - ./chat-templates/:/app/chat-templates
      - ${HOME}:${HOME}
      - ${HOME}/.vllm-workspace:/workspace
      - /srv/llm:/srv/llm
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 60
      # Generous: first boot loads the 116 GB checkpoint from /srv/llm AND
      # compiles Triton/inductor kernels from scratch into empty caches.
      start_period: 1800s

  # Standalone image-generation service (the ONLY non-LLM service here): the
  # Qwen/Qwen-Image-2.1 text-to-image / image-editing diffusion model, served
  # through the diffusers QwenImage21Pipeline behind tools/image_gen_server.py.
  # It is NOT vLLM -- it's a Qwen3-VL-8B text encoder + 7B single-stream DiT +
  # VAE (~32 GB BF16), so there is no KV cache, no continuous batching, and no
  # chat template. It is its own image (Dockerfile.imagegen) sharing only the
  # ROCm/torch base with the LLM services.
  #
  # Same one-at-a-time constraint, but sharper: the ~32 GB of weights already
  # fill one R9700, and the default placement (IMAGEGEN_OFFLOAD=device_map)
  # shards them across all four cards, so this can never run beside any LLM
  # service. Stop the LLM first (rule: one service at a time).
  #
  # EXPERIMENTAL on gfx1201: this pipeline has no verified ROCm/RDNA4 report.
  # It relies on torch SDPA (no FlashAttention). If first boot faults or emits
  # NaN/garbage, try IMAGEGEN_DTYPE=float32 and/or IMAGEGEN_OFFLOAD=sequential
  # (documented non-CUDA fallbacks) before assuming a code bug.
  image-gen:
    <<: *amd_devices
    image: localhost/image-gen:latest
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.imagegen
      args:
        ROCM_IMAGE: ${ROCM_IMAGE}
        GPU_ARCH: ${GPU_ARCH}
        TORCH_VERSION: ${TORCH_VERSION}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION}
        DIFFUSERS_REF: ${DIFFUSERS_REF}
        TRANSFORMERS_VERSION: ${TRANSFORMERS_VERSION}
    container_name: image-gen
    # Same restart policy as the LLM services; the /health gate below keeps it
    # "starting" until the weights are resident, so `restart` won't thrash it.
    restart: unless-stopped
    ports:
      - "${IMAGEGEN_PORT:-8005}:8005"
    networks:
      default:
        aliases:
          - llm-imagegen-backend
    command:
      - --port=8005
    environment:
      - HOME=${HOME}
      # All four cards by default (device_map shards across them). HIP index
      # only, never CUDA_VISIBLE_DEVICES -- same convention as every service.
      - HIP_VISIBLE_DEVICES=${IMAGEGEN_HIP_VISIBLE_DEVICES:-0,1,2,3}
      - ROCR_VISIBLE_DEVICES=${IMAGEGEN_HIP_VISIBLE_DEVICES:-0,1,2,3}
      # Checkpoint + placement, read by tools/image_gen_server.py.
      - IMAGEGEN_MODEL_DIR=${IMAGEGEN_MODEL_DIR:-/srv/llm/Qwen/Qwen-Image-2.1}
      - IMAGEGEN_OFFLOAD=${IMAGEGEN_OFFLOAD:-device_map}
      - IMAGEGEN_DTYPE=${IMAGEGEN_DTYPE:-bfloat16}
      # Own cache dirs (user-owned under ~/.cache, like the other services) so
      # this container's HF/inductor state never overlaps an LLM service's.
      - HF_HOME=${HOME}/.cache/huggingface_imagegen
      - TRITON_CACHE_DIR=${HOME}/.cache/triton_imagegen
      - TORCHINDUCTOR_CACHE_DIR=${HOME}/.cache/torchinductor_imagegen
    volumes:
      - ./tools:/app/tools:ro
      - ${HOME}:${HOME}
      # The 33.1 GB checkpoint lives under /srv/llm (NOT ~/.cache/huggingface:
      # this repo keeps big models off the 98G /home volume -- see AGENTS.md).
      - /srv/llm:/srv/llm
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous: first boot downloads nothing (local dir) but loads ~32 GB of
      # weights and moves them across four cards. /health returns 503 until the
      # pipeline is resident, so the retries only start counting once it's up.
      start_period: 1200s
