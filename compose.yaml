x-vllm-full-cache-volumes: &vllm_full_cache_volumes
  - ./chat-templates/:/app/chat-templates
  - ./fused_moe_configs/:/app/fused_moe_configs
  - ./tools/tune_fused_moe.py:/app/tune_fused_moe.py
  - ./fp8_configs/:/app/fp8_configs
  - ./tools/tune_fp8_dense.py:/app/tune_fp8_dense.py
  - ./fp8_configs/N=2048,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=2048,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=2048,K=256,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=2048,K=256,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=4608,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=4608,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=512,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=512,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=6144,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=6144,K=2048,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=17408,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=17408,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=5120,K=3072,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=5120,K=3072,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=5120,K=8704,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=5120,K=8704,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=7168,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=7168,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  - ./fp8_configs/N=8192,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:/opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/utils/configs/N=8192,K=5120,device_name=AMD_Radeon_R9700,dtype=fp8_w8a8,block_shape=[128,128].json:ro
  # Overlay of protocol.py: tolerate `tools: []` + `tool_choice: "none"` that
  # some clients send (upstream rejects empty tools arrays). Version-locked to
  # VLLM_REF=v0.28.0rc2; refresh from patches/vllm/protocol.py on upgrade.
  - ./patches/vllm/protocol.py:/opt/venv/lib/python3.12/site-packages/vllm/entrypoints/openai/chat_completion/protocol.py:ro
  # Mount the whole home so every tool's dot-dir (caches, kernel JIT dirs) is
  # user-owned on the host. Cache dirs are redirected under ~/.cache via env
  # (TRITON_CACHE_DIR, TORCHINDUCTOR_CACHE_DIR, AITER_JIT_DIR, TILELANG_CACHE_DIR)
  # so `just clear-vllm-caches` can manage them.
  - ${HOME}:${HOME}
  - ${HOME}/.vllm-workspace:/workspace

x-amd-devices: &amd_devices
  devices:
    - /dev/kfd:/dev/kfd
    - /dev/dri:/dev/dri
  group_add:
    - "video"
    # render group gid — host-specific; set RENDER_GID in .env for this host
    # (this host: AMDGPU "render"). Numeric form required because the image
    # has no "render" group entry.
    - "${RENDER_GID:-992}"
  cap_add:
    - SYS_PTRACE
  security_opt:
    - label=disable
  ipc: host

services:
  vllm:
    <<: *amd_devices
    image: localhost/vllm-fullbuild:latest
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.fullbuild
      args:
        ROCM_IMAGE: ${ROCM_IMAGE}
        GPU_ARCH: ${GPU_ARCH}
        MAX_JOBS: ${MAX_JOBS}
        TORCH_VERSION: ${TORCH_VERSION}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION}
        VLLM_REF: ${VLLM_REF}
        VLLM_VERSION: ${VLLM_VERSION}
        AITER_REF: ${AITER_REF}
        FLASH_ATTN_REF: ${FLASH_ATTN_REF}
    container_name: vllm
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    networks:
      default:
        aliases:
          - llm-backend
    volumes: *vllm_full_cache_volumes
    env_file:
      - env/2xr9700.vllm.common
      - env/aiter-unified-attention.env
      - env/qwen3.6.env.common
      - ./env/${MODEL_PROFILE}.env
    environment:
      - HOME=${HOME}
      # Point aiter's JIT build at the user-owned cache dir and put it on
      # sys.path. Without this, non-root runs fall back to ~/.aiter/jit (not on
      # sys.path) and `import aiter.jit.module_aiter_core` fails with
      # ModuleNotFoundError, breaking the unified-attention backend.
      - AITER_JIT_DIR=${HOME}/.cache/aiter/jit
      - TRITON_CACHE_DIR=${HOME}/.cache/triton
      - TORCHINDUCTOR_CACHE_DIR=${HOME}/.cache/torchinductor
      - TILELANG_CACHE_DIR=${HOME}/.cache/tilelang
      - GPU_MAX_HW_QUEUES=1
      - NCCL_P2P_DISABLE=1
      - VLLM_TUNED_CONFIG_FOLDER=/app/fused_moe_configs
      # froggeric Qwen chat template for the qwen3.x profiles. entrypoint.sh
      # omits --chat-template when this is unset, so profiles served by
      # vllm-vision fall back to the tokenizer's built-in template.
      - VLLM_CHAT_TEMPLATE=/app/chat-templates/qwen.jinja
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
  # Second, concurrent vLLM server for a vision-language profile. Same image
  # and entrypoint as `vllm`; it differs only in the env_file profile
  # (${VISION_MODEL_PROFILE}, exported by the justfile), host port, and
  # per-container compile cache dirs (so two containers JIT-ing at once never
  # share mutable cache state). The aiter JIT dir is deliberately SHARED:
  # `just prewarm` builds it once in the main service's env, and concurrent
  # readers of already-built kernels are safe — only concurrent builds race.
  # Both containers see all GPUs (env/2xr9700.vllm.common); assign them
  # non-overlapping GPU sets at runtime when running both at once.
  vllm-vision:
    <<: *amd_devices
    image: localhost/vllm-fullbuild:latest
    user: "${USER_UID:-1000}:${USER_GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile.fullbuild
      args:
        ROCM_IMAGE: ${ROCM_IMAGE}
        GPU_ARCH: ${GPU_ARCH}
        MAX_JOBS: ${MAX_JOBS}
        TORCH_VERSION: ${TORCH_VERSION}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION}
        VLLM_REF: ${VLLM_REF}
        VLLM_VERSION: ${VLLM_VERSION}
        AITER_REF: ${AITER_REF}
        FLASH_ATTN_REF: ${FLASH_ATTN_REF}
    container_name: vision-vllm
    restart: unless-stopped
    ports:
      - "${VISION_PORT:-8001}:8000"
    networks:
      default:
        aliases:
          - llm-vision-backend
    volumes: *vllm_full_cache_volumes
    env_file:
      - env/2xr9700.vllm.common
      - env/aiter-unified-attention.env
      - env/qwen3.6.env.common
      - ./env/${VISION_MODEL_PROFILE}.env
    environment:
      - HOME=${HOME}
      # Shared with the `vllm` service: prewarmed once, read-only afterwards.
      - AITER_JIT_DIR=${HOME}/.cache/aiter/jit
      - TRITON_CACHE_DIR=${HOME}/.cache/triton_vision
      - TORCHINDUCTOR_CACHE_DIR=${HOME}/.cache/torchinductor_vision
      - TILELANG_CACHE_DIR=${HOME}/.cache/tilelang_vision
      - GPU_MAX_HW_QUEUES=1
      - NCCL_P2P_DISABLE=1
      - VLLM_TUNED_CONFIG_FOLDER=/app/fused_moe_configs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
